<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>MenuLens Pro</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
    }
    #viewport {
      flex: 1;
      position: relative;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: none;
      max-width: 100%;
      height: auto;
    }
    .bottom-bar {
      padding: 14px 20px;
      background: #1c1c1e;
      display: flex;
      gap: 12px;
      justify-content: center;
      border-top: 1px solid #2c2c2e;
    }
    button.action-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: #0a84ff;
      color: white;
    }
    button.secondary { background: #3a3a3c; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 24px;
      border-radius: 12px;
      display: none;
      font-weight: bold;
      border: 1px solid #444;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <div><strong>MenuLens 智能描邊覆蓋版</strong></div>
    <button class="action-btn secondary" style="padding: 6px 12px; font-size: 12px;" onclick="setApiKey()">設定 Key</button>
  </header>

  <div id="viewport">
    <div id="loading">正在高精準度覆蓋翻譯...</div>
    <div id="placeholder" style="color: #666;">點擊下方按鈕拍攝 Menu</div>
    <canvas id="mainCanvas"></canvas>
  </div>

  <div class="bottom-bar">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    <button class="action-btn" onclick="document.getElementById('cameraInput').click()">📷 拍攝菜單</button>
    <button id="toggleBtn" class="action-btn secondary" style="display:none;" onclick="toggleView()">顯示原文</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loading');
    const placeholder = document.getElementById('placeholder');
    const toggleBtn = document.getElementById('toggleBtn');

    let originalImageData = null;
    let translatedImageData = null;
    let isShowingOrigin = false;

    function getApiKey() {
      let key = localStorage.getItem('gemini_api_key');
      if (!key) {
        key = prompt("請輸入 Gemini API Key：");
        if (key) localStorage.setItem('gemini_api_key', key.trim());
      }
      return key;
    }

    function setApiKey() {
      const cur = localStorage.getItem('gemini_api_key') || '';
      const key = prompt("更新 Gemini API Key：", cur);
      if (key !== null) localStorage.setItem('gemini_api_key', key.trim());
    }

    document.getElementById('cameraInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = getApiKey();
      if (!apiKey) return alert("請先設定 API Key");

      placeholder.style.display = 'none';
      loading.style.display = 'block';

      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      const maxDim = 1800;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else if (h > maxDim) {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      canvas.style.display = 'block';

      originalImageData = ctx.getImageData(0, 0, w, h);
      const base64Data = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

      try {
        await executeDirectTranslation(apiKey, base64Data, w, h);
        toggleBtn.style.display = "inline-block";
        toggleBtn.innerText = "顯示原文";
        isShowingOrigin = false;
      } catch (err) {
        alert("處理失敗: " + err.message);
      } finally {
        loading.style.display = 'none';
      }
    });

    async function executeDirectTranslation(apiKey, base64Data, imgW, imgH) {
      const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash-8b"];
      
      const prompt = `你是一個專業日文菜單在地化圖像標註助手。
請精確找出圖片中的菜名與重要標題：
1. "box_2d": [ymin, xmin, ymax, xmax]（標準化至 0~1000）。【非常重要】：邊界框必須「緊緊貼合文字筆劃本身」，切勿包含整塊底色背景板、裝飾邊框或旁邊的菜品圖片！
2. "zh": 繁體中文翻譯（簡潔俐落，菜名控制在 2-5 個字以內）。

輸出格式範例（純 JSON 陣列，不帶 markdown 標籤）：
[
  { "box_2d": [ymin, xmin, ymax, xmax], "zh": "紫海膽丼" }
]`;

      let items = null;
      for (const m of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                ]
              }],
              generationConfig: { response_mime_type: "application/json" }
            })
          });
          if (!res.ok) throw new Error();
          const data = await res.json();
          items = JSON.parse(data.candidates[0].content.parts[0].text);
          break;
        } catch (e) {
          await new Promise(r => setTimeout(r, 600));
        }
      }

      if (!items) throw new Error("API 忙碌中，請稍候重試");

      items.forEach(item => {
        const [ymin, xmin, ymax, xmax] = item.box_2d;
        let rx = (xmin / 1000) * imgW;
        let ry = (ymin / 1000) * imgH;
        let rw = ((xmax - xmin) / 1000) * imgW;
        let rh = ((ymax - ymin) / 1000) * imgH;

        if (rw <= 8 || rh <= 8) return;

        // 防禦機制：若框選面積超過畫面 10%，只取頂部文字區域，避免大面積色塊塗死畫面
        if ((rw * rh) > (imgW * imgH * 0.08)) {
          rh = Math.min(rh, 45);
        }

        const { bgColor, textColor, strokeColor } = sampleColor(rx, ry, rw, rh, imgW, imgH);

        // 柔和微底色：半透明輕微抹底，既蓋住原字又保留背景層次
        ctx.fillStyle = bgColor;
        ctx.beginPath();
        ctx.roundRect(rx, ry, rw, rh, 4);
        ctx.fill();

        const isVertical = rh > rw * 1.2;
        const text = item.zh || "";

        if (isVertical) {
          // 直排文字（帶描邊光暈）
          const chars = text.split("");
          let fontSize = Math.min(rw * 0.85, (rh / chars.length) * 0.95);
          fontSize = Math.max(12, Math.min(26, fontSize));

          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const totalTextH = chars.length * fontSize;
          const startY = ry + (rh - totalTextH) / 2 + fontSize / 2;
          const centerX = rx + rw / 2;

          chars.forEach((char, idx) => {
            const posY = startY + (idx * fontSize);
            // 外圍描邊（防止背景雜色干擾）
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3;
            ctx.strokeText(char, centerX, posY);
            // 實心文字
            ctx.fillStyle = textColor;
            ctx.fillText(char, centerX, posY);
          });
        } else {
          // 橫排文字（帶描邊光暈）
          let fontSize = Math.min(rh * 0.75, (rw / text.length) * 1.15);
          fontSize = Math.max(12, Math.min(24, fontSize));

          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const centerX = rx + rw / 2;
          const centerY = ry + rh / 2;

          // 外圍描邊
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = 3;
          ctx.strokeText(text, centerX, centerY, rw);
          // 實心文字
          ctx.fillStyle = textColor;
          ctx.fillText(text, centerX, centerY, rw);
        }
      });

      translatedImageData = ctx.getImageData(0, 0, imgW, imgH);
    }

    // 智能取色：微半透明底色 + 雙重對比描邊顏色
    function sampleColor(x, y, w, h, imgW, imgH) {
      const samplePoints = [
        [Math.max(0, x - 2), Math.max(0, y - 2)],
        [Math.min(imgW - 1, x + w + 2), Math.max(0, y - 2)],
        [Math.max(0, x - 2), Math.min(imgH - 1, y + h + 2)],
        [Math.min(imgW - 1, x + w + 2), Math.min(imgH - 1, y + h + 2)]
      ];

      let r = 0, g = 0, b = 0;
      samplePoints.forEach(([sx, sy]) => {
        const p = ctx.getImageData(Math.floor(sx), Math.floor(sy), 1, 1).data;
        r += p[0]; g += p[1]; b += p[2];
      });

      r = Math.round(r / 4);
      g = Math.round(g / 4);
      b = Math.round(b / 4);

      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      
      // 亮底用「黑字＋白描邊」，深底用「白字＋黑描邊」
      const isLight = lum > 140;
      const textColor = isLight ? "#000000" : "#ffffff";
      const strokeColor = isLight ? "rgba(255, 255, 255, 0.9)" : "rgba(0, 0, 0, 0.9)";

      return {
        // 85% 半透明底，抹除原文字同時自然融入底紋
        bgColor: `rgba(${r}, ${g}, ${b}, 0.85)`,
        textColor: textColor,
        strokeColor: strokeColor
      };
    }

    function toggleView() {
      if (!originalImageData || !translatedImageData) return;
      if (isShowingOrigin) {
        ctx.putImageData(translatedImageData, 0, 0);
        toggleBtn.innerText = "顯示原文";
        isShowingOrigin = false;
      } else {
        ctx.putImageData(originalImageData, 0, 0);
        toggleBtn.innerText = "顯示翻譯";
        isShowingOrigin = true;
      }
    }
  </script>
</body>
</html>
