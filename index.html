<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>MenuLens Touch</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
      z-index: 20;
    }
    #viewport {
      flex: 1;
      position: relative;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0c;
    }
    canvas {
      display: none;
      max-width: 100%;
      height: auto;
      cursor: pointer;
    }
    /* 點擊菜式彈出的詳細資訊卡片 */
    #itemCard {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid #3a3a3c;
      border-radius: 16px;
      padding: 16px 20px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 30;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #itemCard .zh-name { font-size: 20px; font-weight: bold; color: #30d158; margin-bottom: 4px; }
    #itemCard .jp-name { font-size: 14px; color: #8e8e93; margin-bottom: 6px; }
    #itemCard .desc { font-size: 14px; color: #e5e5ea; line-height: 1.4; }
    #itemCard .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 18px;
      color: #8e8e93;
      cursor: pointer;
    }
    .bottom-bar {
      padding: 14px 20px;
      background: #1c1c1e;
      display: flex;
      gap: 12px;
      justify-content: center;
      border-top: 1px solid #2c2c2e;
      z-index: 20;
    }
    button.action-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: #0a84ff;
      color: white;
    }
    button.secondary { background: #3a3a3c; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 24px;
      border-radius: 12px;
      display: none;
      font-weight: bold;
      border: 1px solid #444;
      z-index: 40;
    }
  </style>
</head>
<body>

  <header>
    <div><strong>MenuLens 智能識別</strong></div>
    <div style="font-size: 12px; color: #8e8e93;" id="tipText">點擊畫面菜式可睇大字</div>
    <button class="action-btn secondary" style="padding: 6px 12px; font-size: 12px;" onclick="setApiKey()">Key</button>
  </header>

  <div id="viewport">
    <div id="loading">密集菜單深度解析中...</div>
    <div id="placeholder" style="color: #666;">點擊下方按鈕拍攝 Menu</div>
    <canvas id="mainCanvas"></canvas>

    <!-- 點擊菜色時彈出的卡片 -->
    <div id="itemCard">
      <div class="close-btn" onclick="document.getElementById('itemCard').style.display='none'">✕</div>
      <div class="zh-name" id="cardZh">菜名</div>
      <div class="jp-name" id="cardJp">原文：</div>
      <div class="desc" id="cardDesc">說明</div>
    </div>
  </div>

  <div class="bottom-bar">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    <button class="action-btn" onclick="document.getElementById('cameraInput').click()">📷 拍攝菜單</button>
    <button id="toggleBtn" class="action-btn secondary" style="display:none;" onclick="toggleView()">看原圖</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loading');
    const placeholder = document.getElementById('placeholder');
    const toggleBtn = document.getElementById('toggleBtn');
    const itemCard = document.getElementById('itemCard');

    let originalImageData = null;
    let translatedImageData = null;
    let isShowingOrigin = false;
    let menuItems = [];
    let scaleRatio = 1;

    function getApiKey() {
      let key = localStorage.getItem('gemini_api_key');
      if (!key) {
        key = prompt("請輸入 Gemini API Key：");
        if (key) localStorage.setItem('gemini_api_key', key.trim());
      }
      return key;
    }

    function setApiKey() {
      const cur = localStorage.getItem('gemini_api_key') || '';
      const key = prompt("更新 Gemini API Key：", cur);
      if (key !== null) localStorage.setItem('gemini_api_key', key.trim());
    }

    document.getElementById('cameraInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = getApiKey();
      if (!apiKey) return alert("請先設定 API Key");

      itemCard.style.display = 'none';
      placeholder.style.display = 'none';
      loading.style.display = 'block';

      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      // 提高長邊至 2200px，確保密集的細小假名不會模糊
      const maxDim = 2200;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else if (h > maxDim) {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      canvas.style.display = 'block';

      originalImageData = ctx.getImageData(0, 0, w, h);
      const base64Data = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

      try {
        await executeDenseMenuTranslation(apiKey, base64Data, w, h);
        toggleBtn.style.display = "inline-block";
        toggleBtn.innerText = "看原圖";
        isShowingOrigin = false;
      } catch (err) {
        alert("處理失敗: " + err.message);
      } finally {
        loading.style.display = 'none';
      }
    });

    async function executeDenseMenuTranslation(apiKey, base64Data, imgW, imgH) {
      const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash-8b"];
      
      const prompt = `你是一個專業日本料理菜單辨識專家。這張菜單包含大量密集、垂直直排書寫的菜名。
【請務必完整掃描整張圖片】：從左到右、包含最左邊的烏冬/麵食/甜品，以及中間和右邊的所有壽司、軍艦、手卷項目，不可遺漏！

請為每個獨立品項輸出 JSON：
1. "box_2d": [ymin, xmin, ymax, xmax]（坐標標準化至 0~1000，緊貼文字長條範圍）。
2. "jp": 原文日文菜名。
3. "zh": 繁體中文簡明菜名（2至5個字）。
4. "desc": 簡明食材說明（例如「稻庭烏冬配清湯」、「醃蘿蔔乾手卷」、「知內町產韭菜軍艦」）。

嚴格輸出純 JSON 陣列，不要包裹任何 markdown 標籤：
[
  {
    "box_2d": [ymin, xmin, ymax, xmax],
    "jp": "わんこうどん",
    "zh": "小碗烏冬",
    "desc": "一口碗溫熱烏冬麵"
  }
]`;

      let items = null;
      for (const m of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                ]
              }],
              generationConfig: { response_mime_type: "application/json" }
            })
          });
          if (!res.ok) throw new Error();
          const data = await res.json();
          items = JSON.parse(data.candidates[0].content.parts[0].text);
          break;
        } catch (e) {
          await new Promise(r => setTimeout(r, 600));
        }
      }

      if (!items) throw new Error("API 忙碌中，請稍候重試");

      menuItems = items.map(item => {
        const [ymin, xmin, ymax, xmax] = item.box_2d;
        return {
          ...item,
          rx: (xmin / 1000) * imgW,
          ry: (ymin / 1000) * imgH,
          rw: ((xmax - xmin) / 1000) * imgW,
          rh: ((ymax - ymin) / 1000) * imgH
        };
      });

      // 繪製非破壞性標記（微透明背景＋獨立垂直文字）
      drawOverlay(imgW, imgH);
      translatedImageData = ctx.getImageData(0, 0, imgW, imgH);
    }

    function drawOverlay(imgW, imgH) {
      ctx.putImageData(originalImageData, 0, 0);

      menuItems.forEach(item => {
        const { rx, ry, rw, rh, zh } = item;
        if (rw <= 6 || rh <= 6) return;

        // 畫高亮膠囊邊界（綠色微光），清楚標示每道菜位置
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.strokeStyle = "#30d158";
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.roundRect(rx, ry, Math.max(rw, 18), rh, 4);
        ctx.fill();
        ctx.stroke();

        // 垂直文字排版，逐字垂直列印
        const chars = (zh || "").split("");
        const isVertical = rh > rw * 1.1;

        if (isVertical) {
          let fontSize = Math.min(rw * 0.9, (rh / chars.length) * 0.95);
          fontSize = Math.max(12, Math.min(22, fontSize));

          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const totalH = chars.length * fontSize;
          const startY = ry + (rh - totalH) / 2 + fontSize / 2;
          const centerX = rx + Math.max(rw, 18) / 2;

          chars.forEach((char, idx) => {
            ctx.fillText(char, centerX, startY + (idx * fontSize));
          });
        } else {
          let fontSize = Math.min(rh * 0.8, (rw / chars.length) * 1.1);
          fontSize = Math.max(12, Math.min(20, fontSize));
          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(zh, rx + rw / 2, ry + rh / 2, rw);
        }
      });
    }

    // 支援直接點擊畫面上任何一道菜，彈出高清大字卡
    canvas.addEventListener('click', (e) => {
      if (isShowingOrigin || menuItems.length === 0) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      // 找出點擊中了哪一道菜
      const matched = menuItems.find(item => {
        return clickX >= item.rx && clickX <= (item.rx + Math.max(item.rw, 24)) &&
               clickY >= item.ry && clickY <= (item.ry + item.rh);
      });

      if (matched) {
        document.getElementById('cardZh').innerText = matched.zh;
        document.getElementById('cardJp').innerText = `原文：${matched.jp || '未獲取'}`;
        document.getElementById('cardDesc').innerText = matched.desc || '暫無食材說明';
        itemCard.style.display = 'block';
      }
    });

    function toggleView() {
      if (!originalImageData || !translatedImageData) return;
      if (isShowingOrigin) {
        ctx.putImageData(translatedImageData, 0, 0);
        toggleBtn.innerText = "看原圖";
        isShowingOrigin = false;
      } else {
        itemCard.style.display = 'none';
        ctx.putImageData(originalImageData, 0, 0);
        toggleBtn.innerText = "看翻譯";
        isShowingOrigin = true;
      }
    }
  </script>
</body>
</html>
